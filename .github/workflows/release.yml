name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

cache-mode: none

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Install nix
        uses: cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f # v31
        with:
          nix_path: nixpkgs=https://github.com/nixos/nixpkgs/archive/release-22.11.tar.gz
          extra_nix_config: |
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= loony-tools:pr9m4BkM/5/eSTZlkQyRt57Jz7OMBxNSUiMC4FkcNfk=
            substituters = https://cache.nixos.org/ https://cache.iog.io/ https://cache.zw3rk.com/
      - name: Build
        uses: workflow/nix-shell-action@0a573af0eac8ee96a41b2b029576afca28a1031c # v3.2.1
        with:
          packages: zip
          script: |
            mkdir __pkgs
            printf '%s\n' "$GITHUB_SHA" > __pkgs/COMMIT_SHA
            for sys in msys2 clang64 macos x86_64-macos arm64-macos debian; do
              for lib in libsodium libsodium-vrf libsecp256k1 libblst; do
                out=$(nix build .#dist.$sys.$lib --no-link --print-out-paths -L)
                for ext in pkg.tar.zstd pkg deb; do
                  for pkg in "$out"/*."$ext"; do
                    [ -f "$pkg" ] || continue
                    dest="__pkgs/$sys.$lib.$ext"
                    if [ -e "$dest" ]; then
                      echo "::error::Multiple packages would overwrite $dest" >&2
                      exit 1
                    fi
                    cp "$pkg" "$dest"
                    base=$(basename "$pkg")
                    printf '%s\t%s\n' "$sys.$lib.$ext" "$base" >> __pkgs/INFO
                  done
                done
              done
              (cd __pkgs && zip -9 "$sys.zip" "$sys".*)
            done
      - name: Upload release packages
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-packages
          path: __pkgs/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to publish the GitHub release
    steps:
      # Only consume packages produced by the build job in this tag-push run.
      - name: Download release packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-packages
          path: __pkgs/
      - name: Release
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          files: __pkgs/*
