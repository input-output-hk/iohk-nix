name: Validate IOG Core GH Action
on: push
permissions:
  contents: read
jobs:
  integration:
    strategy:
        fail-fast: false
        matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]
    name: GitHub Action integration test
    runs-on: ${{ matrix.os }}
    steps:
    - uses: input-output-hk/actions/base@77d9db52baebd90239cc4004d88df2101baf8ead # latest
    - name: Check pkg-config
      run: |
        pkg-config --libs libblst
        pkg-config --libs libsodium
        pkg-config --libs libsecp256k1
